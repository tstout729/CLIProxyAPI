# Tabs server on the home host (tmux -L tabs): cmux-style tab list on the left.
# m1-tab sources this on every connection (after ~/.tmux.conf, which the
# server already loaded) and first sets @m1_sidebar_cmd to the sidebar script.
# The laptop's Ghostty sends C-b sequences for Cmd+N, Cmd+W, Cmd+1..9.

# New tab (Cmd+N, Cmd+T), in the home folder.
bind c new-window -c "$HOME"
# Close tab (Cmd+W): a plain shell closes at once; anything else asks first.
bind X if -F "#{m/r:^-?(zsh|bash|sh|fish)$,#{pane_current_command}}" { kill-window } {
  display-menu -x C -y C -T "#[align=centre]Close this tab?" "Close tab and stop what is running" y { kill-window } "" "Cancel" Escape { }
}
# Cmd+9 is the last tab, as in Ghostty and browsers.
bind 9 select-window -t "{end}"
# Rename the tab (Cmd+Shift+R), starting from the name the sidebar shows.
bind , run-shell -b "#{@m1_sidebar_cmd} rename '#{client_name}'"
# Show the next tab that needs you or finished while you were away (Cmd+Shift+U).
bind u run-shell -b "#{@m1_sidebar_cmd} jump '#{client_name}'"

# Clipboard escapes (OSC 52) name the clipboard ("c"): mosh drops tmux's default
# form, which leaves it empty. The first parameter is consumed so tmux and ncurses
# agree on the arguments. A fixed index keeps re-sourcing from adding copies.
set -s 'terminal-overrides[90]' 'xterm*:Ms=\E]52;c%p1%.0s;%p2%s\7'

# The sidebar sits on a darker panel (m1-sidebar's PANEL, for Ghostty's default
# dark theme); borders take its color so the panel has a clean edge.
set -g pane-border-indicators off
set -g pane-border-style "fg=#21252b,bg=#21252b"
set -g pane-active-border-style "fg=#21252b,bg=#21252b"

# Clicks on a sidebar go to it without moving the keyboard focus there.
bind -n MouseDown1Pane if -F -t = "#{@sidebar}" { send-keys -M } { select-pane -t = ; send-keys -M }
# Middle-click closes a tab in the sidebar; elsewhere it keeps tmux's default (paste).
bind -n MouseDown2Pane if -F -t = "#{@sidebar}" { send-keys -M } {
  select-pane -t = ; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { paste-buffer -p }
}
# Anything else that lands focus on a sidebar hands it back to the tab.
set-hook -g pane-focus-in { if -F "#{@sidebar}" { select-pane -R } }

# Keep every tab's sidebar present, sized, and current.
set-hook -g after-new-window { run-shell -b "#{@m1_sidebar_cmd} ensure" }
set-hook -g window-resized { run-shell -b "#{@m1_sidebar_cmd} ensure" }
set-hook -g client-detached { run-shell -b "#{@m1_sidebar_cmd} ensure" }
set-hook -g pane-exited { run-shell -b "#{@m1_sidebar_cmd} ensure" }
set-hook -g after-kill-pane { run-shell -b "#{@m1_sidebar_cmd} ensure" }
set-hook -g window-unlinked { run-shell -b "#{@m1_sidebar_cmd} refresh" }
set-hook -g window-renamed { run-shell -b "#{@m1_sidebar_cmd} refresh" }
set-hook -g alert-bell { run-shell -b "#{@m1_sidebar_cmd} refresh" }
# Focusing a window marks the tab it shows as read.
set-hook -g client-focus-in { run-shell -b "#{@m1_sidebar_cmd} refresh" }
# Remember the tab last shown, so a new terminal window opens on it.
set-hook -g session-window-changed { set -gF @m1_last_tab "#{window_id}" ; run-shell -b "#{@m1_sidebar_cmd} refresh" }
